name: Trabajo del análisis
description: Unidad trazable del proyecto Airbnb Supply Opportunity Analysis
title: "[Nivel/Fase] "
labels: ["analysis"]
body:
  - type: dropdown
    id: level
    attributes:
      label: Nivel
      options: [Esencial, Medio, Avanzado, Experto]
    validations:
      required: true
  - type: input
    id: phase
    attributes:
      label: Fase
    validations:
      required: true
  - type: input
    id: owner
    attributes:
      label: Responsable
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Criterios de aceptación
      description: Incluye pruebas, documentación y evidencia observable.
    validations:
      required: true
  - type: input
    id: pull_request
    attributes:
      label: Pull request vinculada
